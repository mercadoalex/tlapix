[package]
name = "tlapix-ebpf"
version = "0.1.0"
edition = "2021"

[dependencies]
aya-ebpf = "0.1"
aya-log-ebpf = "0.1"

[[bin]]
name = "tlapix-ebpf"
path = "src/main.rs"

[profile.dev]
opt-level = 2
overflow-checks = false
debug = false
panic = "abort"

[profile.release]
lto = true
panic = "abort"
opt-level = 2
strip = "none"
