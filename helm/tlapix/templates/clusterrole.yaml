{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tlapix.fullname" . }}
  labels:
    {{- include "tlapix.labels" . | nindent 4 }}
rules:
  # Read TLS secrets for certificate inventory
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # Read cert-manager resources for renewal tracking
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "certificaterequests", "issuers", "clusterissuers"]
    verbs: ["get", "list", "watch"]
  # Read nodes for DaemonSet scheduling info
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tlapix.fullname" . }}
  labels:
    {{- include "tlapix.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tlapix.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tlapix.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
