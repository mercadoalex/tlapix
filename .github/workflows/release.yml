# Tlapix Release — Build image, push to GHCR, create GitHub Release
#
# Triggered on version tags (v0.1.0, v1.0.0, etc.)

name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Build and push container image
  # ---------------------------------------------------------------------------
  build-image:
    name: Build & Push Image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: demo/Dockerfile.tlapix
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---------------------------------------------------------------------------
  # Build static binary and create GitHub Release
  # ---------------------------------------------------------------------------
  build-binary:
    name: Build Binary
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --bin tlapix

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/tlapix dist/tlapix-linux-amd64
          cp config/tlapix.toml dist/
          tar -czf dist/tlapix-${{ github.ref_name }}-linux-amd64.tar.gz \
            -C dist tlapix-linux-amd64 tlapix.toml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tlapix-${{ github.ref_name }}-linux-amd64.tar.gz
            dist/tlapix-linux-amd64
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Package and publish Helm chart
  # ---------------------------------------------------------------------------
  helm-package:
    name: Package Helm Chart
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: |
          helm package helm/tlapix --version ${{ github.ref_name }} --app-version ${{ github.ref_name }}

      - name: Upload chart as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: tlapix-*.tgz
