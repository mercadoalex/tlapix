apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tlapix.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tlapix.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "tlapix.agentSelectorLabels" . | nindent 6 }}
